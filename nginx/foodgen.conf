# /etc/nginx/sites-available/foodgen.instantoffr.com
#
#   sudo ln -s /etc/nginx/sites-available/foodgen.instantoffr.com /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d foodgen.instantoffr.com
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name foodgen.instantoffr.com;

    # certbot rewrites this to a 443 block and adds the certificate lines.
    location / {
        proxy_pass http://127.0.0.1:2400;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MCP responses can stream as server-sent events. Buffering would hold the
    # stream until it completed, and the default 60s read timeout would cut off
    # a long tool call, so both are relaxed here.
    location /mcp {
        proxy_pass http://127.0.0.1:2400;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    client_max_body_size 2m;
}
